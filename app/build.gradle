apply plugin: 'com.android.application'

def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.myhealth.appointment'
    compileSdk 36

    defaultConfig {
        applicationId "com.myhealth.appointment"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        def supabaseUrl = (localProps.getProperty("SUPABASE_URL") ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
        def supabaseKey = (localProps.getProperty("SUPABASE_ANON_KEY") ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.1'
}
